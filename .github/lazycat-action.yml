version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/k7.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: k7-server

build:
  run_buildscript: false

images:
  - id: k7-server
    target: service
    service: k7-server
    source: ghcr.io/kaybi-gh/k7
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: K7
    summary: "K7 media server for LazyCat"
